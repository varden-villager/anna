<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alien</title>
  <link rel="stylesheet" href="styles/style.css">
  <script src="scripts/prelude.js" defer></script>
</head>
<body>
  <section id="desktop-frame">
    <div id="story-content">
      <div class="story-line">You feel left out in a world</div>
      <div class="story-line">That moves on</div>
      <div class="story-line">Quickly.</div>
      <div class="story-line">As an observer,</div>
      <div class="story-line">You read the news,</div>
      <div class="story-line">Go observe how people around you</div>
      <div class="story-line">Live.</div>
      <div class="story-line">You are an alien to this world.</div>
      <div class="story-line">Your thoughts are alien,</div>
      <div class="story-line">Because people are busy</div>
      <div class="story-line">Living.</div>
      <div class="story-line">And you do not understand how you will manage</div>
      <div class="story-line"><a href="menu.html" class="animated-link">To live.</a></div>
    </div>
  </section>
</body>
</html>
