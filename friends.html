        <br><br><br>
        <div class="story-line">"Only when he looked away did I see —</div>
        <div class="story-line">His head, shaved short, was entirely gray. Except the temples.</div>
        <div class="story-line">“Why so early? Hereditary?”</div>
        <div class="story-line">“No. I turned gray this year —</div>
        <div class="story-line">Eight friends died in Chechnya. Zhenya was the eighth.</div>
        <div class="story-line">The ninth made it back, but he’s broken. He can’t sleep. <a href="grey.html" class="animated-link">Also gray</a>.”</div>    
    </div>
